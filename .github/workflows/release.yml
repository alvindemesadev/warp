name: release

# Builds Warp and publishes a draft GitHub Release with the installers.
# Unsigned (free) — users bypass SmartScreen via "More info -> Run anyway".
# Triggered by pushing a version tag, e.g.  git tag v2.0.0 && git push --tags
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check version consistency
        run: node scripts/check-versions.js

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Svelte check
        run: npm run check

      - name: Vitest coverage
        run: npm run test:coverage

      - name: Cargo fmt
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --lib
        working-directory: src-tauri

      - name: npm audit (high)
        run: npm audit --audit-level=high

      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit --deny warnings || echo "cargo audit reported advisories"
        shell: pwsh
        working-directory: src-tauri

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (see scripts/updater-manifest.js and the README).
          # Keep in sync with the key in ~/.tauri/warp.key used for local builds.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Warp ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false

      # Updater: attach the .sig files and a latest.json manifest to the release.
      # The app checks .../releases/latest/download/latest.json for updates and
      # verifies the installer signature before installing (no SmartScreen flow).
      - name: Generate updater manifest
        run: node scripts/updater-manifest.js --tag ${{ github.ref_name }}

      - name: Verify updater sigs present
        shell: pwsh
        run: |
          $sig = Get-ChildItem src-tauri/target/release/bundle/nsis/*.sig, src-tauri/target/release/bundle/msi/*.sig -ErrorAction SilentlyContinue
          if (-not $sig) { Write-Error "No .sig files found — build was unsigned (missing TAURI_SIGNING_PRIVATE_KEY)"; exit 1 }
          Write-Host "Found sigs: $($sig.Name -join ', ')"
          cargo test --lib updater_signing -- --nocapture
        working-directory: src-tauri

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Generate checksums
        shell: pwsh
        run: |
          $bins = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
          if ($bins) {
            foreach ($b in $bins) { $h = (Get-FileHash $b.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($b.Name)" | Out-File -Append checksums.sha256 }
            Get-Content checksums.sha256
          } else { "no bundles to hash (unsigned local build)" | Out-File checksums.sha256; Get-Content checksums.sha256 }

      - name: Upload updater artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = @('latest.json','sbom.spdx.json','checksums.sha256') + (Get-ChildItem src-tauri/target/release/bundle/nsis/*.sig, src-tauri/target/release/bundle/msi/*.sig | ForEach-Object { $_.FullName })
          gh release upload ${{ github.ref_name }} $files --clobber
