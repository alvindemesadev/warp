<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warp — High-speed File Transfer</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      // TEMP-DEV-SHIM: browser-only mock of the Tauri runtime so the SPA can be
      // previewed without the desktop app. REMOVE AFTER VISUAL VERIFICATION.
      if (!window.__TAURI_INTERNALS__) {
        window.__TAURI_INTERNALS__ = {
          metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
          transformCallback: () => 1,
          invoke: () => Promise.reject(new Error("no tauri runtime")),
          convertFileSrc: (p) => p,
        };
      }
    </script>
  </body>
</html>
